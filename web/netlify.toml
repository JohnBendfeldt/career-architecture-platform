[build]
  command = "npm run build"
  publish = "dist"

# Proxy API traffic through YARP Gateway / Azure App Service
[[redirects]]
  from = "/api/*"
  to = "https://gateway-careerplatform.azurewebsites.net/api/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/geo/*"
  to = "https://gateway-careerplatform.azurewebsites.net/geo/:splat"
  status = 200
  force = false

# SPA Routing Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
