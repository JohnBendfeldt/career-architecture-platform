<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Subtle Architectural Grid Pattern (Editorial Swiss / Japanese Grid) -->
    <pattern id="editorial-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#E2E1DC" stroke-opacity="0.55" stroke-width="1" />
    </pattern>

    <!-- Crisp Editorial Shadow for Uniqlo Mark -->
    <filter id="editorial-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#E60012" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- 1. Warm Editorial Paper Canvas (#F6F5F0) -->
  <rect width="1200" height="630" fill="#F6F5F0" />

  <!-- 2. Subtle Architectural Grid -->
  <rect width="1200" height="630" fill="url(#editorial-grid)" />

