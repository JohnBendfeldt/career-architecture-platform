      <text x="18" y="30" font-family="Menlo-Bold, Courier-Bold, monospace" font-size="11" font-weight="700" fill="#767672" letter-spacing="1.5">03 / AI PIPELINE</text>
      <text x="18" y="58" font-family="Helvetica-Bold, sans-serif" font-size="18" font-weight="bold" fill="#111111">Gemini Skill Extractor</text>
    </g>

    <!-- Index 04 -->
    <g transform="translate(786, 0)">
      <rect width="246" height="86" rx="4" fill="#F6F5F0" stroke="#E2E1DC" stroke-width="1" />
      <text x="18" y="30" font-family="Menlo-Bold, Courier-Bold, monospace" font-size="11" font-weight="700" fill="#767672" letter-spacing="1.5">04 / TELEMETRY</text>
      <text x="18" y="58" font-family="Helvetica-Bold, sans-serif" font-size="18" font-weight="bold" fill="#111111">Garmin FIT &amp; PostGIS</text>
