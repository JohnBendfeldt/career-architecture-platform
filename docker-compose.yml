version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: src/Gateway/Dockerfile
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ReverseProxy__Clusters__apiCluster__Destinations__api1__Address=http://api:8080
      - ReverseProxy__Clusters__geoCluster__Destinations__geo1__Address=http://geo:8080
    depends_on:
      - api
      - geo

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET must be set}
      - ConnectionStrings__DefaultConnection=Data Source=/data/careerplatform.db
    volumes:
      - api_data:/data

  geo:
    build:
      context: .
      dockerfile: src/Geo/Dockerfile
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      - gateway

volumes:
  api_data:
