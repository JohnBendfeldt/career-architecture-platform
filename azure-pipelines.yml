trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '10.0.x'
  nodeVersion: '22.x'

stages:
- stage: BuildAndTest
  displayName: 'Build & Test Suite'
  jobs:
  - job: TestBackend
    displayName: 'Test .NET Microservices'
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET SDK'
      inputs:
        packageType: 'sdk'
        version: $(dotnetVersion)

    - script: dotnet restore CareerPlatform.sln
      displayName: 'Restore NuGet Packages'

    - script: dotnet build CareerPlatform.sln --configuration $(buildConfiguration) --no-restore
      displayName: 'Build Solution'

    - script: dotnet test CareerPlatform.sln --configuration $(buildConfiguration) --no-build --logger trx
      displayName: 'Execute Automated Tests'

    - script: |
        VULN_OUTPUT=$(dotnet list CareerPlatform.sln package --vulnerable --include-transitive)
        echo "$VULN_OUTPUT"
        if echo "$VULN_OUTPUT" | grep -q "has the following vulnerable packages"; then
          exit 1
        fi
      displayName: 'Check Vulnerable NuGet Packages'

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '**/*.trx'

  - job: BuildFrontend
    displayName: 'Build React Vite Frontend'
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: $(nodeVersion)
      displayName: 'Install Node.js'

    - script: |
        npm --prefix web ci
        npm --prefix web run lint
        npm --prefix web test
        npm --prefix web run build
        ./web/node_modules/.bin/tsc -p tsconfig.json --noEmit
        npm --prefix web audit --omit=dev --audit-level=high
      displayName: 'Lint, Test, Typecheck, Audit & Build SPA'

- stage: DockerContainers
  displayName: 'Docker Build & Registry Push'
  dependsOn: BuildAndTest
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: BuildContainers
    displayName: 'Build Microservice Images'
    steps:
    - task: Docker@2
      displayName: 'Build Gateway Image'
      inputs:
        command: build
        dockerfile: 'src/Gateway/Dockerfile'
        repository: 'careerplatform-gateway'
        tags: |
          $(Build.BuildId)
          latest

    - task: Docker@2
      displayName: 'Build API Image'
      inputs:
        command: build
        dockerfile: 'src/Api/Dockerfile'
        repository: 'careerplatform-api'
        tags: |
          $(Build.BuildId)
          latest

    - task: Docker@2
      displayName: 'Build Geo Image'
      inputs:
        command: build
        dockerfile: 'src/Geo/Dockerfile'
        repository: 'careerplatform-geo'
        tags: |
          $(Build.BuildId)
          latest
